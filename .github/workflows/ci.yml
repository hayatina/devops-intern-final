name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t devops-intern-final:${{ github.sha }} \
            app

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t devops-intern-final:test \
            app

      - name: Start container
        run: |
          docker run -d \
            --name devops-nginx-test \
            -p 8080:8080 \
            devops-intern-final:test

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz > /dev/null; then
              echo "Container is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready."
          docker logs devops-nginx-test
          exit 1

      - name: Run healthcheck script
        run: ./scripts/healthcheck.sh http://localhost:8080

      - name: Stop container
        if: always()
        run: docker rm -f devops-nginx-test

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest \
            app

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-intern-final:latest
